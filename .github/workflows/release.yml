name: release

# Merging a change to .github/release/notes.md into main publishes the GitHub release for the
# version in CITATION.cff, with the paper PDFs and the LaTeX source attached. The first line of
# notes.md is the title, the rest the description. On a pull request the assets are only listed.
on:
  push:
    branches: [main]
    paths: [.github/release/notes.md]
  pull_request:
    paths: [.github/release/**, .github/workflows/release.yml, paper/paper1/**, paper/paper2/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *//p' CITATION.cff | tr -d '"')" >> "$GITHUB_OUTPUT"
      - name: Collect the assets
        run: |
          mkdir dist
          cp paper/paper1/*.pdf paper/paper2/*.zip dist/
          ls -l dist
          test "$(ls dist | wc -l)" -ge 3
      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          tail -n +3 .github/release/notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "$(head -n 1 .github/release/notes.md | sed 's/^# *//')" \
            --notes-file "$RUNNER_TEMP/notes.md"
